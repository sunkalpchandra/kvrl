# Latency / memory vs context length. Numbers land in runs/<id>/bench.parquet.
model:
  name: qwen2.5-0.5b-instruct
  device: auto
  dtype: auto

benchmark:
  seed: 0
  chunk: 64
  decide_every: 64
  warmup: 1
  repeats: 5                 # noisy laptop: medians of 5
  max_new_tokens: 32
  context_lengths: [1024, 2048, 4096, 8192]
  budget_fracs: [0.25]
  controllers:
    - {name: full}
    - {name: window}
    - {name: h2o}
    - {name: keynorm}
    - {name: rl, checkpoint: checkpoints/ppo_mlp_v1_3.pt}
  decode_curve_lengths: [512, 1024, 2048, 4096, 8192, 12288, 16384]
