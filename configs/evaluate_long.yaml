# The "critical experiment": largest feasible context on this machine (8K–16K) at 100 / 50 /
# 25 / 12.5 % KV budget. Fewer prompts (each 8K run with stats takes ~1 min), full controllers.
_base: evaluate.yaml
eval:
  seed: 3000
  max_new_tokens: 12
  budget_fracs: [0.5, 0.25, 0.125]
  controllers:
    - {name: full}
    - {name: window}
    - {name: h2o}
    - {name: snapkv}
    - {name: rl, checkpoint: checkpoints/ppo_mlp_v1.pt}
  jobs:
    - {task: needle,   tokens: 8192,  n: 3}
    - {task: kv,       tokens: 8192,  n: 2}
    - {task: lm,       tokens: 8192,  n: 2}
    - {task: needle,   tokens: 16384, n: 2}
    - {task: lm,       tokens: 16384, n: 1}
